services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lectern
      POSTGRES_PASSWORD: lectern
      POSTGRES_DB: lectern
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lectern -d lectern"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/lectern
      DATABASE_USERNAME: lectern
      DATABASE_PASSWORD: lectern
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://lectern:lectern@postgres:5432/lectern
    depends_on:
      postgres:
        condition: service_healthy

  # optional PDF-structure fallback parser (DESIGN §6, ADR-005); start with: docker compose --profile grobid up
  grobid:
    image: grobid/grobid:0.8.1
    profiles: ["grobid"]
    ports:
      - "8070:8070"

volumes:
  pgdata:
