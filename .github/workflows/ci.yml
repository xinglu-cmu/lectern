name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: smoke-test the CLI offline
        run: |
          lectern --version
          lectern scan README.md --no-llm --json > /tmp/scan.json
          python -c "import json; a=json.load(open('/tmp/scan.json')); assert a['segments'], a"
      - name: red-team suite (gates recall ≥ 0.90, precision ≥ 0.80 per technique)
        run: python eval/redteam/run.py --check
      - name: zoning accuracy (labeled set; reported, gated once the set reaches 30 documents)
        run: python eval/zoning/run.py
      - name: conversion snapshots (what the converters read from the seed corpus)
        run: python eval/conversion/run.py
